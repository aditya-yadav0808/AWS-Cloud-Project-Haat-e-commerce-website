<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Haat. Admin</title>
<style>
:root{--navy:#1b2559;--amber:#f5a800;--bg:#f4f6fc;--mute:#6b7390;--bad:#d93025}
*{box-sizing:border-box;margin:0}body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:#1c2033}
button{font:inherit;cursor:pointer;border:0}
header{background:var(--navy);color:#fff;padding:14px 5vw;display:flex;justify-content:space-between;align-items:center}
.logo{font-size:26px;font-weight:800}.logo i{color:var(--amber);font-style:normal}.logo small{font-size:14px;opacity:.7;font-weight:500;margin-left:8px}
.btn{padding:10px 18px;border-radius:10px;font-weight:600;background:var(--amber);color:#2a1d00}.out{background:transparent;color:#fff;border:1px solid #ffffff55}
.wrap{padding:28px 5vw;max-width:1200px;margin:auto}
.login{max-width:380px;margin:12vh auto;background:#fff;padding:30px;border-radius:20px;box-shadow:0 8px 30px #1b255920}
input,select{width:100%;padding:12px;border:1px solid #d5daee;border-radius:10px;font:inherit;background:#f7f8fe;margin:6px 0}
.err{color:var(--bad);min-height:20px;font-size:14px;margin-top:8px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:16px;margin-bottom:26px}
.st{background:#fff;border-radius:16px;padding:20px;box-shadow:0 4px 16px #1b255912}.st span{color:var(--mute);font-size:13px;text-transform:uppercase;letter-spacing:.5px}.st b{display:block;font-size:30px;color:var(--navy);margin-top:4px}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:20px}
.pn{background:#fff;border-radius:16px;padding:20px;box-shadow:0 4px 16px #1b255912;overflow:auto}
h2{font-size:18px;color:var(--navy);margin-bottom:12px}
table{width:100%;border-collapse:collapse;font-size:14px}td,th{text-align:left;padding:9px 6px;border-bottom:1px solid #eef0f8}th{color:var(--mute);font-weight:600}
.del{background:#fde8e6;color:var(--bad);padding:5px 10px;border-radius:8px;font-weight:600}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
</style></head><body>
<header><div class="logo">Haat<i>.</i><small>Admin</small></div><button class="btn out" id="lo" style="display:none">Lock</button></header>

<div class="login" id="gate"><h2>Admin sign in</h2><input id="pw" type="password" placeholder="Admin password"><button class="btn" style="width:100%;margin-top:8px" id="go">Open dashboard</button><div class="err" id="err"></div></div>

<div class="wrap" id="app" style="display:none">
<div class="stats" id="stats"></div>
<div class="cols">
<div class="pn"><h2>Add a product</h2><input id="pn" placeholder="Product name"><div class="two"><input id="pp" type="number" placeholder="Price (₹)"><select id="pi"><option value="">No image</option><option>bottle.jpg</option><option>kurta.jpg</option><option>earbuds.jpg</option><option>shoes.jpg</option><option>mugs.jpg</option><option>backpack.jpg</option></select></div><input id="pd" placeholder="Short description"><button class="btn" id="add" style="margin-top:8px">Add product</button><div class="err" id="perr"></div></div>
<div class="pn"><h2>Products</h2><table id="tp"></table></div>
<div class="pn"><h2>Recent users</h2><table id="tu"></table></div>
<div class="pn"><h2>Recent orders</h2><table id="to"></table></div>
</div></div>

<script>
const $=id=>document.getElementById(id);let PW="";
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const money=n=>"₹"+Number(n).toLocaleString("en-IN");
function api(p,o){o=o||{};o.headers=Object.assign({"Content-Type":"application/json","X-Admin-Password":PW},o.headers||{});
  return fetch(p,o).then(r=>r.text().then(t=>{let j;try{j=JSON.parse(t)}catch(e){throw new Error("The server is not responding (HTTP "+r.status+"). Please try again in a moment.")}
    if(!r.ok)throw new Error(j.error||"Request failed");return j}),()=>{throw new Error("Cannot reach the server.")})}
function load(){return api("/api/admin/summary").then(j=>{
  $("stats").innerHTML=[["Users",j.counts.users],["Orders",j.counts.orders],["Revenue",money(j.counts.revenue)],["Products",j.counts.products]].map(a=>`<div class="st"><span>${a[0]}</span><b>${a[1]}</b></div>`).join("");
  $("tp").innerHTML="<tr><th>Name</th><th>Price</th><th></th></tr>"+j.products.map(p=>`<tr><td>${esc(p.name)}</td><td>${money(p.price)}</td><td><button class="del" data-d="${p.id}">Delete</button></td></tr>`).join("");
  $("tu").innerHTML="<tr><th>Name</th><th>Email</th></tr>"+j.users.map(u=>`<tr><td>${esc(u.name)}</td><td>${esc(u.email)}</td></tr>`).join("");
  $("to").innerHTML="<tr><th>#</th><th>Customer</th><th>Total</th></tr>"+j.orders.map(o=>`<tr><td>${o.id}</td><td>${esc(o.name)}</td><td>${money(o.total)}</td></tr>`).join("")})}
$("go").onclick=()=>{PW=$("pw").value;$("err").textContent="";load().then(()=>{$("gate").style.display="none";$("app").style.display="";$("lo").style.display=""}).catch(e=>$("err").textContent=e.message)};
$("pw").onkeydown=e=>{if(e.key==="Enter")$("go").click()};
$("lo").onclick=()=>{PW="";$("pw").value="";$("gate").style.display="";$("app").style.display="none";$("lo").style.display="none"};
$("add").onclick=()=>{$("perr").textContent="";api("/api/admin/products",{method:"POST",body:JSON.stringify({name:$("pn").value,price:$("pp").value,description:$("pd").value,image:$("pi").value})}).then(()=>{$("pn").value=$("pp").value=$("pd").value="";return load()}).catch(e=>$("perr").textContent=e.message)};
$("tp").onclick=e=>{const d=e.target.dataset.d;if(d&&confirm("Delete this product?"))api("/api/admin/products/"+d,{method:"DELETE"}).then(load).catch(e=>alert(e.message))};
</script></body></html>
